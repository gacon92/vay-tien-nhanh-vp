<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ phân tích dữ liệu ảnh chuyên nghiệp</title>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e5e5e7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .upload-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 24px;
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            background: #f0f7ff;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }
        .upload-link:hover, .upload-link:active {
            background: var(--primary-color);
            color: #fff;
        }
        #imageInput {
            display: none;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 500;
        }
        .result-table, .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            text-align: left;
            font-size: 14px;
        }
        .result-table th, .result-table td, .history-table th, .history-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            word-break: break-word;
        }
        .result-table th, .history-table th {
            background-color: #f8f9fa;
            color: #444;
            font-weight: 600;
        }
        .history-section {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        .history-title {
            margin-top: 0;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-clear {
            font-size: 12px;
            color: #ff3b30;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: 500;
        }
        .no-history {
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="#" class="upload-link" id="uploadTrigger">📸 Chọn ảnh từ thiết bị để xem EXIF</a>
        <input type="file" id="imageInput" accept="image/*">
        
        <div id="status" class="status" style="display: none;"></div>

        <table class="result-table" id="resultTable" style="display: none;">
            <thead>
                <tr>
                    <th style="width: 45%;">Thông số chi tiết ảnh vừa chọn</th>
                    <th>Giá trị</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>

    <div class="history-section">
        <div class="history-title">
            <span>📜 Lịch sử ảnh đã quét (Lưu trên trang)</span>
            <button class="btn-clear" id="clearHistory">Xóa tất cả</button>
        </div>
        <div id="noHistory" class="no-history">Chưa có lịch sử lưu trữ.</div>
        <table class="history-table" id="historyTable" style="display: none;">
            <thead>
                <tr>
                    <th>Tên file</th>
                    <th>Thiết bị chụp</th>
                    <th>Thời gian chụp</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <!-- Kịch bản điều khiển giao diện và bộ nhớ trang web -->
    <script>
        const uploadTrigger = document.getElementById("uploadTrigger");
        const imageInput = document.getElementById("imageInput");
        const statusDiv = document.getElementById("status");
        const resultTable = document.getElementById("resultTable");
        const resultBody = document.getElementById("resultBody");
        const historyTable = document.getElementById("historyTable");
        const historyBody = document.getElementById("historyBody");
        const noHistory = document.getElementById("noHistory");
        const clearHistoryBtn = document.getElementById("clearHistory");

        // Tải lịch sử cũ từ bộ nhớ trình duyệt khi vừa vào trang
        window.addEventListener("DOMContentLoaded", loadHistory);

        // Kích hoạt ô chọn file ẩn khi bấm vào nút Custom hiển thị
        uploadTrigger.addEventListener("click", function(e) {
            e.preventDefault(); // Ngăn chặn nhảy trang do thẻ <a> mặc định
            imageInput.click();
        });

        // Xử lý khi người dùng chọn một ảnh thành công
        imageInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;

            statusDiv.style.display = "block";
            statusDiv.innerText = "⏳ Đang phân tích dữ liệu ảnh...";
            resultTable.style.display = "none";
            resultBody.innerHTML = "";

            EXIF.getData(file, function() {
                const tags = EXIF.getAllTags(this);
                statusDiv.style.display = "none";
                resultTable.style.display = "table";

                // Danh sách thông số chính cần lọc xuất ra bảng hiển thị trực quan
                const dataToShow = {
                    "Tên tệp tin": file.name,
                    "Kích thước tệp": (file.size / 1024).toFixed(1) + " KB",
                    "Định dạng": file.type,
                    "Thiết bị chụp": tags["Thiết bị"] || "Không rõ thiết bị",
                    "Ngày giờ chụp": tags["Ngày giờ chụp"] || "Không tìm thấy dữ liệu thời gian",
                    "Chỉ số ISO": tags["Chỉ số ISO"] || "N/A",
                    "Khẩu độ (F-Number)": tags["Khẩu độ (F-Number)"] ? `f/${tags["Khẩu độ (F-Number)"]}` : "N/A",
                    "Tốc độ màn trập": tags["Tốc độ màn trập"] ? `1/${Math.round(1 / tags["Tốc độ màn trập"])}s` : "N/A",
                    "Tiêu cự": tags["Tiêu cự (FocalLength)"] ? tags["Tiêu cự (FocalLength)"] + " mm" : "N/A"
                };

                // Đổ dữ liệu vào bảng kết quả chi tiết vừa chọn
